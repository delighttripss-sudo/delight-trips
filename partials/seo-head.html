<head>
  <!-- ===============================
       CORE META
  =============================== -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="index, follow" />

  <!-- ===============================
       PRIMARY SEO (DEFAULT / HOME)
       (Override title & description per page)
  =============================== -->
  <title>Delight Trips | Premium Tours, Honeymoon & Holiday Packages</title>

  <meta
    name="description"
    content="Delight Trips is a premium travel company offering curated domestic & international holiday packages, honeymoon tours, spiritual journeys, and offbeat travel experiences across India and beyond."
  />

  <link rel="canonical" href="https://delighttrips.in/" />

  <!-- ===============================
       OPEN GRAPH (SOCIAL + ADS)
  =============================== -->
  <meta
    property="og:title"
    content="Delight Trips | Premium Travel Experiences"
  />
  <meta
    property="og:description"
    content="Plan unforgettable journeys with Delight Trips — domestic tours, luxury escapes, honeymoon packages and full travel support."
  />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://delighttrips.in/" />
  <meta
    property="og:image"
    content="https://delighttrips.in/assets/images/og-banner.webp"
  />

  <!-- ===============================
       TWITTER
  =============================== -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Delight Trips | Holiday Packages" />
  <meta
    name="twitter:description"
    content="Curated tours across India & world destinations with Delight Trips."
  />
  <meta
    name="twitter:image"
    content="https://delighttrips.in/assets/images/og-banner.webp"
  />

  <!-- ===============================
       FAVICON & PWA
  =============================== -->
  <link rel="icon" href="/assets/favicon/favicon.ico" type="image/x-icon" />
  <link
    rel="icon"
    type="image/png"
    sizes="32x32"
    href="/assets/favicon/favicon-32x32.png"
  />
  <link
    rel="icon"
    type="image/png"
    sizes="16x16"
    href="/assets/favicon/favicon-16x16.png"
  />
  <link rel="apple-touch-icon" href="/assets/favicon/apple-touch-icon.png" />
  <link rel="manifest" href="/assets/favicon/site.webmanifest" />

  <!-- ===============================
       PERFORMANCE OPTIMIZATION
  =============================== -->

  <!-- Hero image (LCP) -->
  <link
    rel="preload"
    as="image"
    href="/assets/images/hero/hero.webp"
    fetchpriority="high"
  />

  <!-- Partials preload -->
  <link rel="preload" href="/partials/header.html" as="fetch" crossorigin />
  <link
    rel="preload"
    href="/partials/mobile-menu.html"
    as="fetch"
    crossorigin
  />

  <!-- ===============================
       FONTS (SINGLE SOURCE OF TRUTH)
  =============================== -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    rel="preload"
    as="style"
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
    onload="
      this.onload = null;
      this.rel = 'stylesheet';
    "
  />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
    />
  </noscript>
